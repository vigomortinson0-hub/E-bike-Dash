name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Build in Fresh Directory
        run: |
          REPO_DIR=$GITHUB_WORKSPACE
          cd ..
          
          # Создаем чистый проект
          flutter create --template=app --org com.ebike.dash ebike_app
          cd ebike_app
          
          # Копируем исходный код
          cp $REPO_DIR/lib/main.dart lib/main.dart
          
          # Фиксируем ТОЧНЫЕ совместимые версии пакетов (без мажорных прыжков на 9.x)
          flutter pub add geolocator:12.0.0 flutter_blue_plus:1.32.0 wakelock_plus:1.2.8
          
          # Указываем правильные версии SDK для Android
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle
          
          # Собираем APK
          flutter build apk --release --no-tree-shake-icons
          
          # Возвращаем APK в рабочую папку
          cp build/app/outputs/flutter-apk/app-release.apk $REPO_DIR/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          
