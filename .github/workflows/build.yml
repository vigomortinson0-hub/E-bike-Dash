name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Rebuild Fresh Flutter App Structure
        run: |
          mkdir -p ../temp_code
          cp lib/main.dart ../temp_code/main.dart
          
          # Очищаем папку
          rm -rf * .github
          
          # Создаем чистый проект
          flutter create --template=app --org com.ebike.dash --project-name e_bike_dash .
          
          # Возвращаем наш исходный код
          cp ../temp_code/main.dart lib/main.dart
          
          # Задаем фиксированные ТОЧНЫЕ версии зависимостей без автоматического обновления до 7.x
          flutter pub add geolocator:12.0.0 flutter_blue_plus:1.32.0 wakelock_plus:1.2.8
          
          # Настраиваем версии Android SDK
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle

      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons --no-shrink

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
          
