name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'

      - name: Build in Fresh Directory
        run: |
          # Сохраняем путь к нашему коду
          REPO_DIR=$GITHUB_WORKSPACE
          
          # Выходим из текущей папки, чтобы старые файлы нам не мешали
          cd ..
          
          # Создаем идеально чистый проект с нуля
          flutter create --template=app --org com.ebike.dash ebike_app
          cd ebike_app
          
          # Копируем туда только наш файл с дизайном и логикой
          cp $REPO_DIR/lib/main.dart lib/main.dart
          
          # Добавляем актуальные зависимости (Flutter сам найдет нужные версии)
          flutter pub add geolocator flutter_blue_plus wakelock_plus
          
          # Собираем релизный APK (без ручных правок build.gradle!)
          flutter build apk --release --no-tree-shake-icons
          
          # Возвращаем готовый файл обратно, чтобы GitHub мог его отдать тебе
          cp build/app/outputs/flutter-apk/app-release.apk $REPO_DIR/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          
