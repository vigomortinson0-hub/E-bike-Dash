name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.3'

      - name: Prepare and Build
        run: |
          REPO_DIR=$GITHUB_WORKSPACE
          cd ..
          
          # Создаем проект с явным указанием Android-языка (Kotlin)
          flutter create --template=app --android-language kotlin --org com.ebike.dash ebike_app
          cd ebike_app
          
          # Копируем наш файл main.dart
          cp $REPO_DIR/lib/main.dart lib/main.dart
          
          # Формируем pubspec.yaml с совместимыми версиями
          cat << 'EOF' > pubspec.yaml
          name: ebike_app
          description: "E-bike Dashboard App"
          publish_to: 'none'
          version: 1.0.0+1

          environment:
            sdk: '>=3.2.0 <4.0.0'

          dependencies:
            flutter:
              sdk: flutter
            geolocator: ^11.0.0
            flutter_blue_plus: ^1.32.0
            wakelock_plus: ^1.2.0
            cupertino_icons: ^1.0.6

          dev_dependencies:
            flutter_test:
              sdk: flutter
            flutter_lints: ^3.0.0

          flutter:
            uses-material-design: true
          EOF

          # Прописываем параметры SDK прямо в app/build.gradle
          sed -i 's/compileSdk = .*/compileSdk = 34/' android/app/build.gradle || true
          sed -i 's/minSdk = .*/minSdk = 21/' android/app/build.gradle || true
          sed -i 's/targetSdk = .*/targetSdk = 34/' android/app/build.gradle || true

          # Сборка пакетов и APK
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          
          # Сохраняем APK для загрузки
          cp build/app/outputs/flutter-apk/app-release.apk $REPO_DIR/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app-release.apk
          
